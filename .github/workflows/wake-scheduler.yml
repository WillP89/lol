name: Wake recommendation scheduler

# The free alternative to Render's (paid) Cron Jobs add-on. Render's free-tier web services
# sleep after 15 minutes idle, and a sleeping process can't run its own in-memory checks — see
# docs/DEPLOYMENT.md Step 2.6 and server.ts's own comment on `checkSweep`. GitHub Actions'
# scheduled workflows are free (public repos: unlimited; private repos: within the free
# monthly minutes, and this job runs in a few seconds), so this pings the API purely to keep it
# awake — the actual "is a sweep due" decision still lives entirely in `runSweepIfDue`
# (services/crewRecommendations.ts), so this never double-fires a sweep that already happened.
#
# REAL BUG THIS INTERVAL FIXES, not just the scheduler: this used to run every 30 minutes,
# which is LONGER than Render's own 15-minute idle-sleep timeout — so the dyno was still going
# to sleep between pings and wove right back into a cold boot the moment a real user hit it
# (live-reported: "first login of the day just spins forever, refreshing and retrying fixes
# it" — apps/web/src/app/auth/page.tsx's own comment has the full story). This same dyno
# serves EVERY route, not just the scheduler's own endpoint, so keeping it genuinely
# continuously warm — not just periodically woken — is what actually prevents that, not a
# frontend timeout alone (which only makes a cold start fail honestly, it can't make one not
# happen). 10 minutes leaves a real safety margin under the 15-minute timeout even accounting
# for GitHub's own documented scheduling jitter on scheduled workflows (a few minutes' delay is
# normal, especially on quieter repos) — 30 minutes had none at all.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions -> New repository
# secret): PLOT_API_URL (e.g. https://plot-api.onrender.com, no trailing slash) and
# PLOT_ADMIN_API_KEY (must match ADMIN_API_KEY set on the API service itself). Until both are
# set, this workflow's step is skipped rather than failing loudly every 10 minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # lets you trigger a one-off run manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are set
        id: check
        run: |
          if [ -n "${{ secrets.PLOT_API_URL }}" ] && [ -n "${{ secrets.PLOT_ADMIN_API_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLOT_API_URL and/or PLOT_ADMIN_API_KEY repo secrets are not set — skipping. See docs/DEPLOYMENT.md Step 2.6."
          fi
      - name: Ping the sweep endpoint (wakes the dyno; runSweepIfDue decides whether a sweep actually runs)
        if: steps.check.outputs.configured == 'true'
        run: |
          curl -sS -X POST "${{ secrets.PLOT_API_URL }}/admin/recommendations/sweep" \
            -H "x-admin-key: ${{ secrets.PLOT_ADMIN_API_KEY }}" \
            -w "\nHTTP %{http_code}\n" \
            --max-time 30
      - name: Report scheduler health either way
        if: steps.check.outputs.configured == 'true'
        run: |
          curl -sS "${{ secrets.PLOT_API_URL }}/health/scheduler" -w "\nHTTP %{http_code}\n" --max-time 15
